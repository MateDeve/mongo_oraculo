<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB Agent Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #00ED64;
      --green-dim:  #00684A;
      --bg:         #001E2B;
      --surface:    #0D2231;
      --surface2:   #112733;
      --surface3:   #1B3A4B;
      --text:       #E3EEF4;
      --text2:      #889397;
      --border:     #1B3A4B;
      --radius:     12px;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      flex-shrink: 0;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-logo {
      width: 32px; height: 32px;
      background: var(--green);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: var(--bg);
      flex-shrink: 0;
    }
    .header-title { font-size: 17px; font-weight: 600; }
    .header-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
    }
    .status-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text2);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--surface3);
      transition: background 0.3s;
    }
    .status-dot.ready { background: var(--green); }
    .status-dot.error { background: #ef4444; }

    /* ── Layout ──────────────────────────────────── */
    .body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 10px;
    }

    .pattern-group { display: flex; flex-direction: column; gap: 6px; }
    .pattern-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 8px;
      padding: 9px 12px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.15s ease;
      width: 100%;
    }
    .pattern-btn:hover { border-color: var(--green-dim); color: var(--text); }
    .pattern-btn.active {
      background: rgba(0, 104, 74, 0.25);
      border-color: var(--green);
      color: var(--green);
    }

    .field-group { display: flex; flex-direction: column; gap: 10px; }
    .field label {
      display: block;
      font-size: 11px; color: var(--text2);
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--green); }

    .new-thread-btn {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 12px; font-weight: 500;
      text-align: center;
      transition: all 0.15s;
    }
    .new-thread-btn:hover { border-color: var(--green-dim); color: var(--text); }

    .pattern-desc {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6;
    }

    .sidebar-spacer { flex: 1; }

    /* ── Chat area ───────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Empty state */
    .empty-state {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--text2);
      text-align: center;
      padding: 40px 20px;
    }
    .empty-icon { font-size: 52px; line-height: 1; }
    .empty-state h2 { font-size: 22px; font-weight: 600; color: var(--text); }
    .empty-state p { font-size: 14px; max-width: 330px; line-height: 1.55; }
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 4px;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 12px; cursor: pointer; color: var(--text2);
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--green); color: var(--green); }

    /* Message rows */
    .msg-row {
      display: flex; gap: 12px;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg-row.agent .avatar { background: var(--green-dim); color: var(--green); }
    .msg-row.user  .avatar { background: #1e3a5f; color: #93c5fd; }

    .bubble-wrap { max-width: 80%; }

    .msg-meta {
      font-size: 10px; color: var(--text2);
      margin-bottom: 5px;
      display: flex; align-items: center; gap: 6px;
    }
    .msg-row.user .msg-meta { flex-direction: row-reverse; }
    .meta-tag {
      background: rgba(0, 237, 100, 0.1);
      border: 1px solid rgba(0, 237, 100, 0.2);
      color: var(--green);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px; line-height: 1.7;
      word-wrap: break-word;
    }
    .msg-row.user  .bubble {
      background: #1e3a5f;
      border: 1px solid #2d5282;
      border-bottom-right-radius: 4px;
    }
    .msg-row.agent .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble.error {
      background: rgba(127, 29, 29, 0.3);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .bubble pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .bubble code {
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      font-size: 12.5px;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble :not(pre) > code {
      background: rgba(255,255,255,0.08);
      padding: 2px 5px; border-radius: 4px;
    }
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }

    /* Typing indicator */
    .typing-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text2);
      border-radius: 50%;
      animation: blink 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── Input area ──────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      padding: 14px 20px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }

    .msg-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px; font-family: inherit;
      resize: none; outline: none;
      line-height: 1.5;
      min-height: 44px; max-height: 150px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    .msg-input:focus { border-color: var(--green); }
    .msg-input::placeholder { color: var(--text2); }

    .send-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      background: var(--green);
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .send-btn:hover:not(:disabled) { background: #2af77e; transform: scale(1.05); }
    .send-btn:disabled { background: var(--surface3); cursor: not-allowed; }
    .send-btn svg { fill: var(--bg); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">DS</div>
    <span class="header-title">Delfos SUFI</span>
    <div class="header-right">
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting…</span>
      </div>
    </div>
  </div>

  <div class="body">
    <aside class="sidebar">

      <div>
        <div class="section-label">Pattern</div>
        <div class="pattern-group">
          <button class="pattern-btn" data-pattern="rag" onclick="setPattern('rag')">
            📄&nbsp; RAG
          </button>
          <button class="pattern-btn" data-pattern="structured" onclick="setPattern('structured')">
            🗄️&nbsp; Structured Query
          </button>
          <button class="pattern-btn active" data-pattern="hybrid" onclick="setPattern('hybrid')">
            ⚡&nbsp; Hybrid
          </button>
        </div>
      </div>

      <div>
        <div class="section-label">Session</div>
        <div class="field-group">
          <div class="field">
            <label>Thread ID</label>
            <input type="text" id="threadId" value="demo" spellcheck="false" />
          </div>
          <div class="field">
            <label>User ID</label>
            <input type="text" id="userId" value="analyst_1" spellcheck="false" />
          </div>
        </div>
      </div>

      <button class="new-thread-btn" onclick="newThread()">＋ New Thread</button>

      <div class="sidebar-spacer"></div>

      <div>
        <div class="section-label">About this pattern</div>
        <p class="pattern-desc" id="patternDesc"></p>
      </div>

    </aside>

    <div class="chat-area">
      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-row">
          <textarea
            class="msg-input"
            id="msgInput"
            placeholder="Ask your agent… (Enter to send, Shift+Enter for new line)"
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="send()" title="Send (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var DESCRIPTIONS = {
      rag: 'Uses vector similarity to search the knowledge base. Best for open-ended questions about documents, policies, and unstructured content.',
      structured: 'Generates and runs MongoDB aggregation pipelines against your data. Best for precise queries, filtering records, and analytics.',
      hybrid: 'Combines knowledge-base retrieval and structured queries, then uses the assess tool to synthesize a complete answer. Great for complex questions that need both context and data.'
    };

    var SUGGESTIONS = {
      rag: ['What topics are in the knowledge base?', 'Summarize the main documents', 'What are the key policies?'],
      structured: ['Show me recent activity events', 'How many records are there?', 'Aggregate events by type'],
      hybrid: ['Give me a complete analysis', 'What happened and why?', 'Compare data with the documentation']
    };

    var currentPattern = 'hybrid';

    function setPattern(p) {
      currentPattern = p;
      document.querySelectorAll('.pattern-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.pattern === p);
      });
      document.getElementById('patternDesc').textContent = DESCRIPTIONS[p] || '';
      var empty = document.getElementById('messages').querySelector('.empty-state');
      if (empty) renderSuggestions(empty);
    }

    function renderSuggestions(emptyEl) {
      var chipsEl = emptyEl.querySelector('.chips');
      if (!chipsEl) return;
      chipsEl.innerHTML = (SUGGESTIONS[currentPattern] || []).map(function(s) {
        return '<div class="chip" data-text="' + escapeHtml(s) + '" onclick="fillInput(this.dataset.text)">'
          + escapeHtml(s) + '</div>';
      }).join('');
    }

    function showEmptyState() {
      var container = document.getElementById('messages');
      if (container.querySelector('.msg-row')) return;
      container.innerHTML = '';
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<div class="empty-icon">🤖</div>'
        + '<h2>Ask your agent</h2>'
        + '<p>Choose a pattern, set your thread and user IDs, then send a message below.</p>'
        + '<div class="chips"></div>';
      container.appendChild(empty);
      renderSuggestions(empty);
    }

    function fillInput(text) {
      var el = document.getElementById('msgInput');
      el.value = text;
      el.focus();
      resizeInput(el);
    }

    function newThread() {
      var id = 'thread_' + Date.now().toString(36);
      document.getElementById('threadId').value = id;
      document.getElementById('messages').innerHTML = '';
      showEmptyState();
    }

    /* ── Markdown renderer ────────────────────── */
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderMarkdown(text) {
      // Split on fenced code blocks to avoid mangling their content
      var parts = text.split(/(```(?:[^\n`]*)?\n[\s\S]*?```)/g);
      return parts.map(function(part, i) {
        if (i % 2 === 1) {
          var inner = part.replace(/^```[^\n]*\n?/, '').replace(/```$/, '').trim();
          return '<pre><code>' + escapeHtml(inner) + '</pre>';
        }
        var s = part;
        // inline code
        s = s.replace(/`([^`\n]+)`/g, function(_, c) { return '<code>' + escapeHtml(c) + '</code>'; });
        // bold
        s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        // italic
        s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
        // unordered list items
        s = s.replace(/(^|\n)- ([^\n]+)/g, '$1<li>$2</li>');
        if (s.includes('<li>')) s = '<ul>' + s + '</ul>';
        // newlines
        s = s.replace(/\n/g, '');
        return s;
      }).join('');
    }

    /* ── Message helpers ──────────────────────── */
    function appendMessage(role, content, opts) {
      var container = document.getElementById('messages');
      var empty = container.querySelector('.empty-state');
      if (empty) empty.remove();

      var row = document.createElement('div');
      row.className = 'msg-row ' + role;

      var avatarChar = role === 'user'
        ? ((document.getElementById('userId').value || 'U').charAt(0).toUpperCase())
        : 'M';

      var metaHtml = '';
      if (opts && opts.pattern) {
        metaHtml = '<div class="msg-meta">'
          + '<span class="meta-tag">' + escapeHtml(opts.pattern) + '</span>'
          + '<span>' + escapeHtml(opts.thread || '') + '</span>'
          + '</div>';
      }

      var bubbleClass = 'bubble' + (opts && opts.error ? ' error' : '');
      row.innerHTML = '<div class="avatar">' + escapeHtml(avatarChar) + '</div>'
        + '<div class="bubble-wrap">'
        + metaHtml
        + '<div class="' + bubbleClass + '">' + renderMarkdown(content) + '</div>'
        + '</div>';

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
      var container = document.getElementById('messages');
      var row = document.createElement('div');
      row.className = 'msg-row agent';
      row.id = 'typing-row';
      row.innerHTML = '<div class="avatar">M</div>'
        + '<div class="typing-bubble">'
        + '<div class="dot"></div><div class="dot"></div><div class="dot"></div>'
        + '</div>';
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function hideTyping() {
      var el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    /* ── Input handling ───────────────────────── */
    function resizeInput(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    document.getElementById('msgInput').addEventListener('input', function() {
      resizeInput(this);
    });

    document.getElementById('msgInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    /* ── Send ─────────────────────────────────── */
    async function send() {
      var input   = document.getElementById('msgInput');
      var sendBtn = document.getElementById('sendBtn');
      var text    = input.value.trim();
      if (!text || sendBtn.disabled) return;

      var threadId = document.getElementById('threadId').value.trim() || 'demo';
      var userId   = document.getElementById('userId').value.trim()   || 'user_demo';

      input.value = '';
      input.style.height = '44px';
      sendBtn.disabled = true;

      appendMessage('user', text);
      showTyping();

      try {
        var res  = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pattern: currentPattern, threadId: threadId, userId: userId, message: text })
        });
        var data = await res.json();
        hideTyping();

        if (!res.ok || data.error) {
          appendMessage('agent', data.error || 'An error occurred.', { error: true });
        } else {
          appendMessage('agent', data.answer, { pattern: currentPattern, thread: threadId });
        }
      } catch (err) {
        hideTyping();
        appendMessage('agent', 'Network error: ' + err.message, { error: true });
      }

      sendBtn.disabled = false;
      input.focus();
    }

    /* ── Health check ─────────────────────────── */
    async function checkHealth() {
      try {
        var res = await fetch('/api/health');
        if (res.ok) {
          document.getElementById('statusDot').className  = 'status-dot ready';
          document.getElementById('statusText').textContent = 'Ready';
        } else {
          throw new Error('not ok');
        }
      } catch (_) {
        document.getElementById('statusDot').className  = 'status-dot error';
        document.getElementById('statusText').textContent = 'Offline';
      }
    }

    // Init
    setPattern('hybrid');
    showEmptyState();
    checkHealth();
  </script>
</body>
</html>
